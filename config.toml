[theme]
base = "light"
primaryColor = "#d6483b"
font = "sans serif"

[server]
# Streamlit's default module watcher walks every loaded package to find local sources.
# With transformers installed that triggers its lazy vision imports (donut, dpt, ...),
# which raise ModuleNotFoundError for torchvision and stall startup with pages of
# tracebacks. Disabling the watcher avoids the walk entirely; it only costs
# auto-reload-on-save during local development.
fileWatcherType = "none"

# Nothing here is uploaded by the app; disabling the uploader trims the attack surface.
maxUploadSize = 1

[browser]
gatherUsageStats = false
